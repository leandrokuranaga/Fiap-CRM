services:
  api:
    build:
      context: .
      dockerfile: src/Fiap.CRM.Api/Dockerfile
    image: fiap-crm-api:latest
    container_name: fiap-crm-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - mysql
      - redis
      - keycloak
      - jaeger
      - loki
    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: CRM
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak2
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: "dev-file"          # banco embutido H2, sem volume
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_LOG_LEVEL: "info"
    ports:
      - "8082:8080"
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger2
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # HTTP ingest
      - "6831:6831/udp" # agent
    networks:
      - backend

  loki:
    image: grafana/loki:2.9.0
    container_name: loki2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
  redis_data:
  loki_data:
