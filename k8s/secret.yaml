apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  labels:
    app: crm-api
type: Opaque
stringData:
  # Database (MySQL)
  ConnectionStrings__DefaultConnection: "Server=mysql;Database=crm;User=root;Password=CHANGE_ME"
  ConnectionStrings__Redis: "redis:6379"
  # AWS SQS
  ServiceBus__AccessKey: "CHANGE_ME"
  ServiceBus__SecretKey: "CHANGE_ME"
  ServiceBus__QueueName: "lambda-queue"
