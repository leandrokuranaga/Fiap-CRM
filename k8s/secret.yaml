apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  labels:
    app: crm-api
type: Opaque
stringData:
  # Database (MySQL)
  ConnectionStrings__CRMConnection: "${CRM_CONNECTION}"
  ConnectionStrings__Redis: "${REDIS_CONNECTION}"
  ConnectionStrings__EventStore: "${EVENTSTORE_CONNECTION}"
  # AWS SQS
  ServiceBus__AccessKey: "${AWS_SQS_ACCESS_KEY}"
  ServiceBus__SecretKey: "${AWS_SQS_SECRET_KEY}"
  # AWS SDK Standard Credentials
  AWS_ACCESS_KEY_ID: "${AWS_SQS_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SQS_SECRET_KEY}"
  # JWT
  JwtSettings__SecretKey: "${JWT_SECRET}"
